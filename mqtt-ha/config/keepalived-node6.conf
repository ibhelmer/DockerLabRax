global_defs {
    router_id MQTT_NODE6
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/local/sbin/check-mqtt-haproxy.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight 0
}

vrrp_instance VI_MQTT {
    state BACKUP
    interface eth0
    version 2
    virtual_router_id 63
    priority 100
    advert_int 1

    unicast_src_ip 192.168.1.106
    unicast_peer {
        192.168.1.105
    }
    check_unicast_src

    virtual_ipaddress {
        192.168.1.200/24 dev eth0
    }

    track_script {
        chk_haproxy
    }
}
