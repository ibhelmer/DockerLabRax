global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 2h
    timeout server 2h
    timeout check 2s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend mqtt_frontend
    bind *:1884
    default_backend mqtt_brokers

backend mqtt_brokers
    balance leastconn
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server vmq0 mqtt_vmq0:1883 check resolvers docker init-addr libc,none
    server vmq1 mqtt_vmq1:1883 check resolvers docker init-addr libc,none
    server vmq2 mqtt_vmq2:1883 check resolvers docker init-addr libc,none